production:
  generate_weekly_meals:
    class: GenerateWeeklyMealsJob
    schedule: every day at 6am
    queue: default

  meal_reminder:
    class: MealReminderJob
    schedule: every day at 9am
    queue: default

  rsvp_deadline_reminder:
    class: RsvpDeadlineReminderJob
    schedule: every hour at minute 30
    queue: default

  close_rsvps:
    class: CloseRsvpsJob
    schedule: every 15 minutes
    queue: default

  stream_usage_report:
    class: StreamUsageReportJob
    schedule: every day at 7am
    queue: default

  generate_task_instances:
    class: GenerateTaskInstancesJob
    schedule: every day at 5am
    queue: default

  # 3:15am Pacific; must match NightlyBackupJob's Sentry monitor (CON-31)
  nightly_backup:
    class: NightlyBackupJob
    schedule: "15 3 * * * America/Los_Angeles"
    queue: default

  task_reminders:
    class: TaskRemindersJob
    schedule: every hour at minute 5
    queue: default
  meal_needs_cook:
    class: MealNeedsCookJob
    schedule: "0 9 * * * America/Los_Angeles"
    queue: default

  email_log_retention:
    class: EmailLogRetentionJob
    schedule: every day at 4am
    queue: default

  # Clears the App Store / Play reviewers' demo community (CON-66)
  demo_reset:
    class: DemoResetJob
    schedule: "0 3 * * 0 America/Los_Angeles"
    queue: default

development:
  generate_weekly_meals:
    class: GenerateWeeklyMealsJob
    schedule: every day at 6am
    queue: default

  meal_reminder:
    class: MealReminderJob
    schedule: every day at 9am
    queue: default

  rsvp_deadline_reminder:
    class: RsvpDeadlineReminderJob
    schedule: every hour at minute 30
    queue: default

  close_rsvps:
    class: CloseRsvpsJob
    schedule: every 15 minutes
    queue: default

  stream_usage_report:
    class: StreamUsageReportJob
    schedule: every day at 7am
    queue: default
