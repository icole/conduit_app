production:
  generate_weekly_meals:
    class: GenerateWeeklyMealsJob
    schedule: every day at 6am
    queue: default

  meal_reminder:
    class: MealReminderJob
    schedule: every day at 9am
    queue: default

  rsvp_deadline_reminder:
    class: RsvpDeadlineReminderJob
    schedule: every hour at minute 30
    queue: default

  close_rsvps:
    class: CloseRsvpsJob
    schedule: every 15 minutes
    queue: default

  stream_usage_report:
    class: StreamUsageReportJob
    schedule: every day at 7am
    queue: default

development:
  generate_weekly_meals:
    class: GenerateWeeklyMealsJob
    schedule: every day at 6am
    queue: default

