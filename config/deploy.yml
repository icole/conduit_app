service: conduit_app
image: <%= ENV["DOCKER_USERNAME"] %>/conduit_app
deploy_timeout: 120

servers:
  web:
    - <%= ENV["CONDUIT_SERVER_IP"] %>

ssh:
  user: <%= ENV["CONDUIT_SSH_USER"] %>
  # GCE host key; not a default OpenSSH name, so name it rather than rely on an agent
  keys: [ "~/.ssh/google_compute_engine" ]

proxy:
  ssl: true
  hosts:
    - <%= ENV["CONDUIT_DOMAIN"] %>
    - <%= ENV["CONDUIT_API_DOMAIN"] %>
    - <%= ENV["CONDUIT_DEMO_DOMAIN"] %>
  healthcheck:
    interval: 5
    timeout: 180
    path: /up

registry:
  username: <%= ENV["DOCKER_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_IOS_CLIENT_ID
    - GOOGLE_ANDROID_CLIENT_IDS
    - GOOGLE_CLIENT_SECRET
    - CONDUIT_APP_DATABASE_PASSWORD
    - CALENDAR_CONFIG_CONTENT
    - GOOGLE_CALENDAR_ID
    - GOOGLE_DRIVE_FOLDER_ID
    - GOOGLE_IMPERSONATE_EMAIL
    - RESEND_API_KEY
    - STREAM_API_KEY
    - STREAM_API_SECRET
    - SENTRY_DSN
    - LIVEBLOCKS_SECRET_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    # Where new-community and Stream usage alerts go; unset means don't send
    CONDUIT_ADMIN_EMAIL: <%= ENV["CONDUIT_ADMIN_EMAIL"] %>
    # Stream plan's monthly-active-user allowance, for the usage guardrail
    STREAM_MAU_LIMIT: <%= ENV["STREAM_MAU_LIMIT"] %>

volumes:
  - "conduit_app_storage:/rails/storage"

# Add PostgreSQL as an accessory
accessories:
  db:
    image: postgres:15
    host: <%= ENV["CONDUIT_SERVER_IP"] %>
    port: 5432
    env:
      clear:
        POSTGRES_USER: conduit_app
        POSTGRES_DB: conduit_app_production
      secret:
        - CONDUIT_APP_DATABASE_PASSWORD
        - POSTGRES_PASSWORD
    files:
      - .kamal/postgres/init.sql:/docker-entrypoint-initdb.d/setup.sql
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data

builder:
  arch: amd64

aliases:
  console: app exec --reuse -i "bin/rails console"