# Push notification credentials (action_push_native), from the environment
# like the app's other secrets. A platform without them is skipped
# (ApplicationPushDevice.platform_configured?).
shared:
  apple:
    # APNs token auth: an Apple Developer "Keys" key with Apple Push Notifications
    # enabled. APNS_KEY is the .p8 file's contents, with its line breaks
    # written as \n (Kamal passes secrets as single lines, and escapes the
    # backslash on the way into the container, so accept \\n too).
    key_id: <%= ENV["APNS_KEY_ID"] %>
    encryption_key: <%= ENV["APNS_KEY"].to_s.gsub(/\\+n/, "\n").dump %>
    team_id: <%= ENV["APNS_TEAM_ID"] %>
    topic: com.colecoding.ConduitApp
    # Builds run straight from Xcode get development tokens; TestFlight and
    # App Store builds get production ones.
    connect_to_development_server: <%= ENV["APNS_DEVELOPMENT"] == "true" %>

  google:
    # A Firebase service account key for the app's Firebase project, as JSON
    # or base64-encoded JSON (what .env.deploy sends: Kamal would mangle the
    # JSON's quotes and backslashes).
    <% fcm = ENV["FCM_SERVICE_ACCOUNT"].to_s.strip %>
    encryption_key: <%= (fcm.start_with?("{") ? fcm : Base64.decode64(fcm)).dump %>
    project_id: <%= ENV["FCM_PROJECT_ID"] %>
