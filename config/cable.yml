# Postgres LISTEN/NOTIFY in development, so a broadcast from bin/rails
# console (creating notifications to try the apps' live bell) reaches the
# pages bin/dev serves. The async adapter only works within one process.
development:
  adapter: postgresql

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
